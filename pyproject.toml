[project]
name = "algo"
version = "0.1.0"
description = "CLI tool for testing algorithm solutions against problem definitions"
readme = "README.md"
requires-python = ">=3.14"
# algo.py intentionally depends only on the Python standard library.
dependencies = []

[project.scripts]
algo = "algo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Single-file module, not a package.
include = ["algo.py"]

[dependency-groups]
dev = ["pyright>=1.1.390"]

[tool.pyright]
include = ["algo.py"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
