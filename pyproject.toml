[project]
name = "algo"
version = "0.1.0"
description = "CLI tool for testing algorithm solutions against problem definitions"
readme = "README.md"
requires-python = ">=3.14"
# algo.py intentionally depends only on the Python standard library.
dependencies = []

[project.scripts]
algo = "algo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Single-file module under src/, not a package. `sources` strips the src/
# prefix so it installs as the top-level `algo` module (see project.scripts).
include = ["src/algo.py"]
sources = ["src"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pyright>=1.1.390",
    "ruff>=0.9.0",
]

[tool.pyright]
include = ["src/algo.py"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py314"
line-length = 120
