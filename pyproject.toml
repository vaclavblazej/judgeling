[project]
name = "judgeling"
version = "0.1.6"
description = "Minimalistic tool to manage problem packages for competitive programming"
readme = "README.md"
requires-python = ">=3.14"
# judgeling.py intentionally depends only on the Python standard library.
dependencies = []

[project.scripts]
judgeling = "judgeling:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Single-file module under src/, not a package. `sources` strips the src/
# prefix so it installs as the top-level `judgeling` module (see project.scripts).
include = ["src/judgeling.py"]
sources = ["src"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pyright>=1.1.390",
    "ruff>=0.9.0",
]

[tool.pyright]
include = ["src/judgeling.py"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py314"
# Effectively unbounded so `ruff format` never wraps lines.
line-length = 9999
